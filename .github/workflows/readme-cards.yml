name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC (midnight in São Paulo)
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # fail_on_error + continue-on-error: if GitHub's API hiccups,
      # yesterday's card stays instead of being replaced by an error card.
      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&bg_color=0d1117&title_color=95BF47&icon_color=95BF47&ring_color=95BF47&text_color=c9d1d9&border_color=30363d
          path: profile/stats.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=0d1117&title_color=95BF47&text_color=c9d1d9&border_color=30363d
          path: profile/top-langs.svg
          token: ${{ secrets.STATS_PAT }}
          fail_on_error: true

      - name: Generate contribution graph
        continue-on-error: true
        run: python3 .github/scripts/activity_graph.py
        env:
          GH_TOKEN: ${{ secrets.STATS_PAT }}
          GH_LOGIN: ${{ github.repository_owner }}
          OUT: profile/activity-graph.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
