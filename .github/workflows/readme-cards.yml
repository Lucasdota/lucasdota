name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC (midnight in São Paulo)
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # If this step fails, nothing is committed and yesterday's cards stay up.
      - name: Generate profile cards
        run: python3 .github/scripts/profile_cards.py
        env:
          GH_TOKEN: ${{ secrets.STATS_PAT }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git pull --rebase origin ${{ github.ref_name }}
          git push
