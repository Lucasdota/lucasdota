<svg xmlns="http://www.w3.org/2000/svg" width="860" height="312" viewBox="0 0 860 312" role="img" aria-label="Languages weighted by my commits">
<style>
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.growx{transform-box:fill-box;transform-origin:0 50%;animation:growx 1.1s cubic-bezier(.2,.8,.2,1) both}
.fade{animation:fade .6s ease-out both}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.twinkle{animation:tw 2.6s ease-in-out infinite}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.5}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x=".5" y=".5" width="859" height="311" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="32" y="54" font-size="24" font-weight="800" fill="#e6edf3">Languages</text>
<text x="32" y="80" font-size="14" fill="#8b949e">weighted by my commits · Dec 2025 – Nov 2026</text>
<defs><clipPath id="bar"><rect x="32" y="102" width="796" height="12" rx="6"/></clipPath></defs>
<rect x="32" y="102" width="796" height="12" rx="6" fill="#21262d"/>
<g clip-path="url(#bar)"><g class="growx">
<rect x="32.0" y="102" width="431.8" height="12" fill="#95BF47"/>
<rect x="463.2" y="102" width="150.5" height="12" fill="#008060"/>
<rect x="613.1" y="102" width="137.3" height="12" fill="#AEE9D1"/>
<rect x="749.8" y="102" width="50.7" height="12" fill="#5E8E3E"/>
<rect x="800.0" y="102" width="27.6" height="12" fill="#FFC453"/>
<rect x="827.0" y="102" width="1.6" height="12" fill="#4b5563"/>
</g></g>
