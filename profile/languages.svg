<g class="fade" style="animation-delay:0.62s"><circle cx="39" cy="217" r="6" fill="#FFC453"/><text x="56" y="222" font-size="15" fill="#e6edf3">SCSS</text><text x="414" y="222" font-size="15" font-weight="700" text-anchor="end" fill="#e6edf3">3.4%</text><line x1="32" y1="238.5" x2="414" y2="238.5" stroke="#21262d"/></g>
<g class="fade" style="animation-delay:0.70s"><circle cx="453" cy="217" r="6" fill="#4b5563"/><text x="470" y="222" font-size="15" fill="#e6edf3">Other</text><text x="828" y="222" font-size="15" font-weight="700" text-anchor="end" fill="#e6edf3">0.1%</text><line x1="446" y1="238.5" x2="828" y2="238.5" stroke="#21262d"/></g>
<text x="32" y="282" font-size="13" fill="#8b949e">also in my day-to-day</text>
